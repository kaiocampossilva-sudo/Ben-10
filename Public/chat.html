<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#050a05">
    <title>Chat — Ben 10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="chat"><canvas id="fx"></canvas>
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="chat-page">
        <header class="top">
            <div class="omni" id="omni"><svg viewBox="0 0 100 100">
                    <path d="M18 10h64L54 50l28 40H18l28-40z" fill="#39ff14" />
                    <path d="M30 18h40L50 46zM30 82h40L50 54z" fill="#111" />
                </svg></div>
            <div class="who"><b id="alien-name">Ben Tennyson</b><small id="hello">Conectado ao Omnitrix</small></div>
            <button class="out" id="logout">Sair</button>
        </header>
        <nav class="aliens" id="aliens" aria-label="Escolher alien"></nav>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="chips" id="chips"></div>
        <form class="send" id="form"><input id="msg" placeholder="Pergunte algo ao Ben..." autocomplete="off"
                aria-label="Mensagem"><button aria-label="Enviar">➤</button></form>
    </div>
    <script src="app.js"></script>
</body>

</html>
